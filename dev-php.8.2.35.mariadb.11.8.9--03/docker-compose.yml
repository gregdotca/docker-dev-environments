services:

  dev-web:
    build:
      context: './build/php-apache'
    container_name: 'dev-web'
    depends_on:
      - 'dev-db'
    networks:
      - 'backend'
      - 'frontend'
    ports:
      - '80:80'
    restart: 'unless-stopped'
    volumes:
      - './html:/var/www/html'
      - './log/php-apache:/var/log'

  dev-db:
    build:
      context: './build/mariadb'
    container_name: 'dev-db'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}'
      MARIADB_AUTO_UPGRADE: '1'
      TZ: 'America/Vancouver'
    networks:
      - 'frontend'
      - 'backend'
    ports:
      - '3306:3306'
    restart: 'unless-stopped'
    volumes:
      - 'db:/var/lib/mysql'
      - './config/mariadb:/etc/mysql/conf.d'
      - './log/mariadb:/var/log'
      - './build/mariadb-init:/docker-entrypoint-initdb.d'

  dev-phpmyadmin:
    build:
      context: './build/phpmyadmin'
    container_name: 'dev-phpmyadmin'
    depends_on:
      - 'dev-db'
      - 'dev-web'
    environment:
      PMA_HOST: 'dev-db'
    networks:
      - 'backend'
      - 'frontend'
    ports:
      - '8080:80'
    restart: 'unless-stopped'
    volumes:
      - './log/phpmyadmin:/var/log'
  
  dev-mail:
    build:
      context: './build/mailpit'
    container_name: 'dev-mail'
    environment:
      # Accept any SMTP login over plain SMTP, as MailHog did
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      # Keep every message, as MailHog did (Mailpit's default is 500)
      MP_MAX_MESSAGES: '0'
    networks:
      - 'backend'
      - 'frontend'
    ports:
      - '8081:8025'
      - '8082:1025'
    restart: 'unless-stopped'
# Disables Mailpit's logging
# Only enable this for specific testing
    logging:
      driver: 'none' 

networks:
  backend:
  frontend:

volumes:
    db:
      # Keep the volume made before the folder was renamed from
      # dev-php.8.2.9.mariadb.11.1.2--03
      name: 'dev-php829mariadb1112--03_db'

